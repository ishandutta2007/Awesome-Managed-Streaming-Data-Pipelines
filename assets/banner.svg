<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pipeline Path Gradient -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: url(#titleGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .stream-path {
        fill: none;
        stroke-linecap: round;
      }
      /* Flow animations */
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .flow-anim-1 {
        stroke-dasharray: 12 16;
        animation: flowDash 8s linear infinite;
      }
      .flow-anim-2 {
        stroke-dasharray: 8 14;
        animation: flowDash 6s linear infinite reverse;
      }
      .flow-anim-3 {
        stroke-dasharray: 10 18;
        animation: flowDash 10s linear infinite;
      }
      .node-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-tag {
        animation: floatNode 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Behind Pipeline -->
  <circle cx="600" cy="180" r="280" fill="url(#glowPulse)" />
  <circle cx="950" cy="90" r="140" fill="url(#glowPulse)" opacity="0.5" />
  <circle cx="200" cy="270" r="160" fill="url(#glowPulse)" opacity="0.4" />

  <!-- Dynamic Data Stream Wave Lines in Background -->
  <path class="stream-path flow-anim-1" d="M -50 70 Q 250 20, 550 80 T 1250 60" stroke="url(#streamGrad1)" stroke-width="3" />
  <path class="stream-path flow-anim-2" d="M -50 280 Q 300 330, 650 270 T 1250 300" stroke="url(#streamGrad2)" stroke-width="3" />
  <path class="stream-path flow-anim-3" d="M -50 170 Q 400 90, 800 240 T 1250 180" stroke="url(#streamGrad1)" stroke-width="2" opacity="0.6" />

  <!-- Animated Node Rings & Floating Data Points -->
  <g class="node-pulse">
    <circle cx="120" cy="100" r="22" fill="#0284c7" opacity="0.15" />
    <circle cx="120" cy="100" r="6" fill="#38bdf8" />

    <circle cx="1080" cy="120" r="26" fill="#8b5cf6" opacity="0.15" />
    <circle cx="1080" cy="120" r="7" fill="#a855f7" />

    <circle cx="1020" cy="260" r="20" fill="#06b6d4" opacity="0.15" />
    <circle cx="1020" cy="260" r="5" fill="#22d3ee" />

    <circle cx="160" cy="260" r="24" fill="#ec4899" opacity="0.15" />
    <circle cx="160" cy="260" r="6" fill="#f472b6" />
  </g>

  <!-- Foreground Pill Tag -->
  <g transform="translate(600, 72)">
    <rect x="-160" y="-18" width="320" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="-135" cy="-1" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4" text-anchor="middle" class="badge-text">⚡ ENTERPRISE REAL-TIME DATA ARCHITECTURE</text>
  </g>

  <!-- Main Title & Subtitle in crisp foreground -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" text-anchor="middle" class="title-text" filter="url(#glow)">Awesome Managed Streaming Data Pipelines</text>
    <text x="0" y="44" text-anchor="middle" class="subtitle-text">Curated SaaS Platforms, Serverless Engines &amp; Open-Source Stream Processing Ecosystem</text>
    <text x="0" y="74" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#64748b">
      Kafka • Flink • Beam • Redpanda • RisingWave • Bytewax • CDC • Real-Time ETL • Event Streams
    </text>
  </g>

  <!-- Bottom Visual Connectors / Processing Pipeline Diagrammatic Nodes -->
  <g transform="translate(300, 310)">
    <!-- Node 1: Source -->
    <rect x="-70" y="-18" width="140" height="32" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
    <text x="0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">📥 Ingest (CDC/Events)</text>

    <!-- Arrow 1 -->
    <path d="M 75 0 L 115 0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Node 2: Stream Engine -->
    <rect x="130" y="-18" width="140" height="32" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="200" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ddd6fe">⚙️ Stream Transform</text>

    <!-- Arrow 2 -->
    <path d="M 275 0 L 315 0" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Node 3: Sink / Analytics -->
    <rect x="330" y="-18" width="140" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="400" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">🚀 Sink / Lakehouse</text>
  </g>
</svg>
