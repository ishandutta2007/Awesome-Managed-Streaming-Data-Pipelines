<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="streamGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient><linearGradient id="streamGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".2"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><radialGradient id="glowPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px;fill:url(#titleGrad)}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:17px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.stream-path{fill:none;stroke-linecap:round}.flow-anim-1{stroke-dasharray:12 16;animation:flowDash 8s linear infinite}.flow-anim-2{stroke-dasharray:8 14;animation:flowDash 6s linear infinite reverse}.flow-anim-3{stroke-dasharray:10 18;animation:flowDash 10s linear infinite}.node-pulse{animation:pulseGlow 4s ease-in-out infinite;transform-origin:center}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#1e293b" stroke-width=".8" opacity=".35"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="600" cy="180" r="280" fill="url(#glowPulse)"/><circle cx="950" cy="90" r="140" fill="url(#glowPulse)" opacity=".5"/><circle cx="200" cy="270" r="160" fill="url(#glowPulse)" opacity=".4"/><path stroke="url(#streamGrad1)" stroke-width="3" d="M -50 70 Q 250 20, 550 80 T 1250 60" class="stream-path flow-anim-1"/><path stroke="url(#streamGrad2)" stroke-width="3" d="M -50 280 Q 300 330, 650 270 T 1250 300" class="stream-path flow-anim-2"/><path stroke="url(#streamGrad1)" stroke-width="2" d="M -50 170 Q 400 90, 800 240 T 1250 180" class="stream-path flow-anim-3" opacity=".6"/><g class="node-pulse"><circle cx="120" cy="100" r="22" fill="#0284c7" opacity=".15"/><circle cx="120" cy="100" r="6" fill="#38bdf8"/><circle cx="1080" cy="120" r="26" fill="#8b5cf6" opacity=".15"/><circle cx="1080" cy="120" r="7" fill="#a855f7"/><circle cx="1020" cy="260" r="20" fill="#06b6d4" opacity=".15"/><circle cx="1020" cy="260" r="5" fill="#22d3ee"/><circle cx="160" cy="260" r="24" fill="#ec4899" opacity=".15"/><circle cx="160" cy="260" r="6" fill="#f472b6"/></g><g transform="translate(600, 72)"><rect width="320" height="34" x="-160" y="-18" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="17"/><circle cx="-135" cy="-1" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="5" y="4" class="badge-text" text-anchor="middle">⚡ ENTERPRISE REAL-TIME DATA ARCHITECTURE</text></g><g><text x="0" y="0" class="title-text" filter="url(#glow)" text-anchor="middle" transform="translate(600, 160)">Awesome Managed Streaming Data Pipelines</text><text x="0" y="44" class="subtitle-text" text-anchor="middle" transform="translate(600, 160)">Curated SaaS Platforms, Serverless Engines &amp; Open-Source Stream Processing Ecosystem</text><text x="0" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle" transform="translate(600, 160)">Kafka • Flink • Beam • Redpanda • RisingWave • Bytewax • CDC • Real-Time ETL • Event Streams</text></g><g transform="translate(300, 310)"><rect width="140" height="32" x="-70" y="-18" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" rx="8"/><text x="0" y="3" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📥 Ingest (CDC/Events)</text><path stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.5" d="M 75 0 L 115 0"/><rect width="140" height="32" x="130" y="-18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" rx="8"/><text x="200" y="3" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚙️ Stream Transform</text><path stroke="#a855f7" stroke-dasharray="3 3" stroke-width="1.5" d="M 275 0 L 315 0"/><rect width="140" height="32" x="330" y="-18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="400" y="3" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="mi